# Compila los instaladores de Windows, macOS y Linux y los publica en GitHub Releases
# al subir una etiqueta de versión:  git tag v0.2.0 && git push origin v0.2.0
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            plataforma: win
            certificado: WIN_CERTIFICADO
            clave: WIN_CERTIFICADO_CLAVE
          - so: macos-latest
            plataforma: mac
            certificado: MAC_CERTIFICADO
            clave: MAC_CERTIFICADO_CLAVE
          - so: ubuntu-latest
            plataforma: linux
            certificado: NINGUNO
            clave: NINGUNO
    runs-on: ${{ matrix.so }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: node scripts/fetch-bin.mjs ${{ matrix.plataforma }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Instalador y publicación
        shell: bash
        # Los secretos que no existen llegan vacíos y electron-builder tomaría un CSC_LINK vacío por
        # una ruta: se quitan antes de compilar
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder --${{ matrix.plataforma }} --publish always --config.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma (opcional, ver README): si existen estos secretos, el instalador sale firmado y,
          # en macOS, notarizado. Sin ellos se publica sin firmar, como hasta ahora.
          CSC_LINK: ${{ secrets[matrix.certificado] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.clave] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish complete release
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish after all platform builds pass
        shell: bash
        run: |
          release_version="$(node -p "require('./package.json').version")"
          release_tag="v$release_version"
          if [[ "$release_version" == *-* ]]; then
            gh release edit "$release_tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$release_tag" --draft=false --prerelease=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
