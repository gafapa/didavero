appId: es.apuntesia.app
productName: Didavero
copyright: Copyright © 2026 Pablo Gallego

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-web/**
  - build/icon.png
  - build/icon.ico
  - package.json
  - LICENSE
  - "!**/*.map"

# Pandoc y Typst van fuera del asar para poder ejecutarlos
extraResources:
  - from: resources-bin/${os}
    to: bin
    filter: ["**/*", "!.*"]

asar: true

win:
  verifyUpdateCodeSignature: true
  # Instalador y versión portable (un .exe que no se instala; los datos van junto a él)
  target: [nsis, portable]
  icon: build/icon.ico
  artifactName: Didavero-Setup.${ext}

portable:
  artifactName: Didavero-portable.${ext}

nsis:
  oneClick: true
  perMachine: false # se instala para el usuario actual, sin pedir permisos de administrador
  deleteAppDataOnUninstall: false # los apuntes están en Documentos y nunca se borran
  shortcutName: Didavero
  createDesktopShortcut: always

mac:
  target: dmg
  category: public.app-category.education
  artifactName: Didavero-mac-${arch}.${ext}

linux:
  target: AppImage
  category: Education
  artifactName: Didavero-linux.${ext}

# Actualizaciones automáticas: las versiones se publican en GitHub Releases.

publish:
  provider: github
  owner: gafapa
  repo: didavero
  releaseType: release
